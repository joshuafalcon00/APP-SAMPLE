<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Group Messages</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#D6336C" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root{
    --paper: #F8E3EC;
    --card: #FFFAFC;
    --ink: #2E2A22;
    --muted: #8A6472;
    --line: #E4B9CC;
    --accent: #D6336C;
    --accent-contrast: #FFF7FA;
    --accent-soft: #F4C6DA;
    --danger: #8C3A2B;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  .page{ max-width: 480px; margin: 0 auto; padding: 22px 18px 40px; }

  .page-head h1{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    font-size: 23px;
    font-weight: 600;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .page-head .sub{
    margin: 0;
    color: var(--muted);
    font-size: 13.5px;
    max-width: 34ch;
  }

  #banner{ margin-top: 14px; }
  .banner{
    background: #F4E3DC;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    display:flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .banner button{
    background:none; border:none; color:var(--danger); font-size:13px;
    text-decoration: underline; cursor:pointer; padding:0; flex-shrink:0;
  }

  .section-title{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    margin: 26px 0 8px;
  }
  .section-title:first-of-type{ margin-top: 20px; }

  .empty-state{
    padding: 18px 2px 22px;
    color: var(--muted);
    font-size: 14px;
  }

  /* Avatars */
  .avatar{
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%; overflow:hidden; flex-shrink:0;
    background: var(--accent-soft); border: 2px solid var(--accent);
    color: var(--accent); font-family: Georgia, serif; font-weight:600;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .avatar-label{ cursor:pointer; display:inline-block; }

  /* People list */
  .person-list{ list-style:none; margin:0; padding:0; }
  .person-row{ border-bottom: 1px solid var(--line); }
  .person-row:first-child{ border-top: 1px solid var(--line); }
  .person-head{
    width:100%; display:flex; align-items:center; gap:10px;
    background:none; border:none; text-align:left; padding: 12px 2px;
    cursor:pointer; font: inherit; color: inherit;
  }
  .person-name{ flex:1; font-size: 15px; font-weight:500; }
  .person-status{ font-size: 12px; color: var(--danger); flex-shrink:0; }

  .chevron{
    display:inline-block; color: var(--muted); font-size: 15px;
    transition: transform .18s ease; flex-shrink:0;
  }
  .chevron.open{ transform: rotate(90deg); }

  .person-panel, .group-panel{
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin: 0 2px 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .panel-manage{
    display:flex; justify-content: space-between; align-items:center; margin-bottom: 10px;
  }
  .link-btn{
    background:none; border:none; cursor:pointer; padding:2px 0;
    font: 13px -apple-system, sans-serif; color: var(--accent);
  }
  .link-btn.danger{ color: var(--danger); }
  .link-btn:hover{ text-decoration: underline; }
  .link-btn:disabled{ opacity:.45; cursor:not-allowed; text-decoration:none; }

  .field-label{ display:block; font-size: 12.5px; color: var(--muted); margin: 12px 0 6px; }
  .field-label:first-of-type{ margin-top: 4px; }

  textarea, input[type="text"], select{
    width:100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    font: 14px -apple-system, sans-serif;
    color: var(--ink);
    background: #fff;
  }
  textarea{ resize: vertical; font-family: inherit; }
  textarea:focus, input:focus, select:focus{ outline: 2px solid var(--accent); outline-offset: 1px; }

  .primary-btn{
    margin-top: 10px;
    background: var(--accent);
    color: var(--accent-contrast);
    border:none; border-radius: var(--radius);
    padding: 10px 16px;
    font: 14px -apple-system, sans-serif; font-weight: 600;
    cursor:pointer;
  }
  .primary-btn:disabled{ background: var(--line); color: var(--muted); cursor:not-allowed; }

  .photo-edit{ display:flex; align-items:center; gap:14px; margin: 4px 0 14px; }
  .photo-actions{ display:flex; flex-direction:column; gap:4px; align-items:flex-start; }

  .person-edit-form{ display:flex; flex-direction:column; }
  .person-edit-form input{ margin-bottom: 8px; }
  .person-edit-form button{
    align-self:flex-start; background:var(--accent); color:var(--accent-contrast);
    border:none; border-radius:8px; padding:8px 14px; font:13.5px sans-serif; cursor:pointer;
  }
  .link-preview{ font-size:13px; color:var(--muted); word-break:break-all; margin:0; }

  .contacts{ margin-top: 6px; }
  .contact-row{
    display:flex; align-items:center; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .contact-row:last-child{ border-bottom:none; }
  .contact-name{ flex:1; font-size: 14px; }
  .contact-row.sent .contact-name{ text-decoration: line-through; color: var(--muted); }
  .sent-check{
    flex-shrink:0; width:18px; height:18px; accent-color: var(--accent); cursor:pointer;
  }
  .pill-btn{
    display:inline-block; background: var(--accent); color: var(--accent-contrast);
    font-size: 12.5px; padding: 6px 12px; border-radius: 999px; text-decoration:none; flex-shrink:0;
  }
  .pill-btn.disabled{ background: var(--line); color: var(--muted); }
  .icon-btn{
    background:none; border:none; cursor:pointer; color: var(--muted);
    font-size: 12.5px; padding: 4px; flex-shrink:0;
  }
  .icon-btn:hover{ color: var(--danger); }

  /* Progress bar */
  .progress-label{ font-size: 12.5px; color: var(--muted); margin: 0 0 6px; display:flex; justify-content:space-between; gap:8px; }
  .progress-label .badge-complete{ color: var(--accent); font-weight:600; }
  .progress-track{
    width:100%; height:7px; background: var(--line); border-radius:999px; overflow:hidden; margin: 0 0 12px;
  }
  .progress-fill{ height:100%; background: var(--accent); border-radius:999px; transition: width .2s ease; }

  .checklist-actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; align-items:center; }
  .checklist-actions .primary-btn{ margin-top:0; }
  .checklist-actions .link-btn{ padding: 10px 4px; }

  .hint-text{ font-size: 13px; color: var(--muted); margin: 14px 0 0; }
  .member-picker{ margin-top: 4px; }
  .add-member-form{ display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap; }
  .add-member-form select{ flex:1; min-width:0; }
  .add-member-form button{
    background: var(--accent); color: var(--accent-contrast); border:none;
    border-radius: 8px; padding: 9px 14px; font: 13.5px sans-serif; font-weight:600;
    cursor:pointer; flex-shrink:0;
  }

  .add-card{
    margin-top: 16px; padding: 16px; background: var(--card);
    border-radius: var(--radius); box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .add-card h3{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    font-size: 15px; font-weight: 600; margin: 0 0 10px;
  }
  .add-card form{ display:flex; flex-direction:column; gap:8px; }
  .add-card > form > button{
    align-self:flex-start; background: var(--accent); color: var(--accent-contrast);
    border:none; border-radius: 8px; padding: 9px 16px; font: 13.5px sans-serif;
    font-weight:600; cursor:pointer;
  }

  .group-list{ list-style:none; margin: 0; padding:0; }
  .group-row{ border-bottom: 1px solid var(--line); }
  .group-row:first-child{ border-top: 1px solid var(--line); }
  .group-head{
    width:100%; display:flex; align-items:center; gap: 10px;
    background:none; border:none; text-align:left; padding: 15px 2px; cursor:pointer; font: inherit; color: inherit;
  }
  .group-name{
    flex:1; font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    font-size: 17px; font-weight: 500;
  }
  .group-count{ font-size: 12.5px; color: var(--muted); flex-shrink:0; text-align:right; }
  .group-count .complete-tag{ color: var(--accent); font-weight:600; }

  .rename-form{ display:flex; gap:8px; flex:1; margin-right: 10px; }
  .rename-form input{ flex:1; }
  .rename-form button{
    background: var(--accent); color:var(--accent-contrast); border:none;
    border-radius: 8px; padding: 8px 12px; font-size:13px; cursor:pointer; flex-shrink:0;
  }

  .page-foot{ margin-top: 26px; }
</style>
</head>
<body>
<div class="page">
  <header class="page-head">
    <h1>Group Messages</h1>
    <p class="sub">Save a message once per group. Open each person's chat ready to paste and send, and check them off as you go.</p>
  </header>

  <div id="banner"></div>
  <div id="app"></div>
</div>

<script>
(function(){
  // Standalone storage shim: this app was originally built to run inside
  // Claude's Artifact sandbox, which injects a `window.storage` object backed
  // by Anthropic's servers. That object does not exist in a normal browser,
  // a hosted web page, or an Android WebView shell, so outside of Claude.ai
  // every save/load call would fail. This shim reimplements the same
  // get/set/delete/list interface on top of localStorage, which is available
  // everywhere (including inside an Android WebView APK). If real
  // window.storage IS present (i.e. you're still running this inside a
  // Claude artifact), it's left alone and takes priority.
  if (!window.storage) {
    window.storage = {
      get: function(key){
        return new Promise(function(resolve, reject){
          try{
            var v = localStorage.getItem(key);
            if(v === null){ resolve(null); return; }
            resolve({ key: key, value: v, shared: false });
          }catch(e){ reject(e); }
        });
      },
      set: function(key, value){
        return new Promise(function(resolve, reject){
          try{
            localStorage.setItem(key, value);
            resolve({ key: key, value: value, shared: false });
          }catch(e){ reject(e); }
        });
      },
      delete: function(key){
        return new Promise(function(resolve){
          try{ localStorage.removeItem(key); }catch(e){}
          resolve({ key: key, deleted: true, shared: false });
        });
      },
      list: function(prefix){
        return new Promise(function(resolve){
          var keys = [];
          for(var i=0;i<localStorage.length;i++){
            var k = localStorage.key(i);
            if(!prefix || k.indexOf(prefix) === 0) keys.push(k);
          }
          resolve({ keys: keys, prefix: prefix, shared: false });
        });
      }
    };
  }

  var STORAGE_PEOPLE_KEY = 'people-data-v2';
  var STORAGE_GROUPS_KEY = 'groups-data-v2';

  var peopleState = { people: [] };
  var groupsState = { groups: [] };
  var uiState = {
    expandedPersonId: null, editingPersonId: null, pendingDeletePersonId: null,
    expandedGroupId: null, renamingGroupId: null, pendingDeleteGroupId: null,
    pendingClearAll: false, copiedGroupId: null, quickCopied: false
  };
  var pendingDeletePersonTimeout = null;
  var pendingDeleteGroupTimeout = null;
  var pendingClearTimeout = null;
  var copiedTimeout = null;
  var quickCopiedTimeout = null;
  var quickMessageDraft = '';

  function genId(prefix){
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function normalizeLink(input){
    input = (input || '').trim();
    if(!input) return '';
    if(/^https?:\/\//i.test(input)) return input;
    input = input.replace(/^@/, '').replace(/^m\.me\//i, '').replace(/^messenger\.com\/t\//i, '');
    return 'https://m.me/' + input;
  }

  function copyToClipboard(text){
    return new Promise(function(resolve, reject){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(resolve).catch(reject);
        return;
      }
      try{
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        resolve();
      }catch(err){ reject(err); }
    });
  }

  function showBanner(message){
    var banner = document.getElementById('banner');
    banner.innerHTML = '<div class="banner"><span>' + escapeHtml(message) + '</span>' +
      '<button data-action="dismiss-banner">Dismiss</button></div>';
  }
  function clearBanner(){ document.getElementById('banner').innerHTML = ''; }

  async function loadPeople(){
    try{
      var res = await window.storage.get(STORAGE_PEOPLE_KEY, false);
      if(res && res.value){
        var parsed = JSON.parse(res.value);
        if(parsed && Array.isArray(parsed.people)) return parsed;
      }
    }catch(e){ /* no saved data yet */ }
    return { people: [] };
  }
  async function loadGroups(){
    try{
      var res = await window.storage.get(STORAGE_GROUPS_KEY, false);
      if(res && res.value){
        var parsed = JSON.parse(res.value);
        if(parsed && Array.isArray(parsed.groups)){
          parsed.groups.forEach(function(g){
            if(!Array.isArray(g.memberIds)) g.memberIds = [];
            if(typeof g.message !== 'string') g.message = '';
            if(!Array.isArray(g.sentIds)) g.sentIds = [];
            if(typeof g.completed !== 'boolean') g.completed = false;
          });
          return parsed;
        }
      }
    }catch(e){ /* no saved data yet */ }
    return { groups: [] };
  }

  async function savePeople(){
    try{ await window.storage.set(STORAGE_PEOPLE_KEY, JSON.stringify(peopleState), false); }
    catch(e){ showBanner("Couldn't save your changes. Check your connection and try again."); }
  }
  async function saveGroups(){
    try{ await window.storage.set(STORAGE_GROUPS_KEY, JSON.stringify(groupsState), false); }
    catch(e){ showBanner("Couldn't save your changes. Check your connection and try again."); }
  }

  function findPerson(id){
    for(var i=0;i<peopleState.people.length;i++){ if(peopleState.people[i].id===id) return peopleState.people[i]; }
    return null;
  }
  function findGroup(id){
    for(var i=0;i<groupsState.groups.length;i++){ if(groupsState.groups[i].id===id) return groupsState.groups[i]; }
    return null;
  }

  function loadAndResizeImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var size = 240;
          var canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext('2d');
          var srcSize = Math.min(img.width, img.height);
          var sx = (img.width - srcSize) / 2;
          var sy = (img.height - srcSize) / 2;
          ctx.drawImage(img, sx, sy, srcSize, srcSize, 0, 0, size, size);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = function(){ reject(new Error('bad image')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('bad file')); };
      reader.readAsDataURL(file);
    });
  }

  function renderAvatar(person, sizePx){
    var style = 'width:'+sizePx+'px;height:'+sizePx+'px;font-size:'+Math.round(sizePx*0.42)+'px;';
    if(person.photo){
      return '<span class="avatar" style="'+style+'"><img src="'+person.photo+'" alt="" /></span>';
    }
    var initial = (person.name || '?').trim().charAt(0).toUpperCase() || '?';
    return '<span class="avatar" style="'+style+'">'+escapeHtml(initial)+'</span>';
  }

  function render(){
    var root = document.getElementById('app');
    var html = '';

    html += '<div class="add-card">';
    html += '<h3>Quick message</h3>';
    html += '<p class="hint-text">For a one-off note outside your saved groups. Copying it clears the box automatically.</p>';
    html += '<textarea id="quickMessage" rows="3" data-action="edit-quick-message" placeholder="Type a message to copy and send">'+escapeHtml(quickMessageDraft)+'</textarea>';
    var quickHasText = quickMessageDraft.trim().length > 0;
    html += '<button type="button" class="primary-btn" data-action="quick-copy" '+(quickHasText?'':'disabled')+'>'+(uiState.quickCopied?'Copied':'Copy')+'</button>';
    html += '</div>';

    html += '<h2 class="section-title">Groups</h2>';
    if(groupsState.groups.length === 0){
      html += '<p class="empty-state">No groups yet. Add one below to get started.</p>';
    } else {
      html += '<ul class="group-list">';
      groupsState.groups.forEach(function(g){
        var expanded = uiState.expandedGroupId === g.id;
        var count = g.memberIds.length;
        var sentCount = g.sentIds.length;

        html += '<li class="group-row">';
        html += '<button type="button" class="group-head" data-action="toggle-group" data-id="'+g.id+'">';
        html += '<span class="chevron'+(expanded?' open':'')+'">&#8250;</span>';
        html += '<span class="group-name">'+escapeHtml(g.name)+'</span>';
        html += '<span class="group-count">'+count+' '+(count===1?'person':'people')+
          (g.completed ? '<br><span class="complete-tag">Marked complete</span>' : (count>0 ? '<br>'+sentCount+'/'+count+' sent' : ''))+'</span>';
        html += '</button>';

        if(expanded){
          html += '<div class="group-panel">';
          html += '<div class="panel-manage">';
          if(uiState.renamingGroupId === g.id){
            html += '<form class="rename-form" data-action="confirm-rename" data-id="'+g.id+'">';
            html += '<input type="text" name="rename" value="'+escapeHtml(g.name)+'" />';
            html += '<button type="submit">Save</button></form>';
          } else {
            html += '<button type="button" class="link-btn" data-action="start-rename" data-id="'+g.id+'">Rename</button>';
          }
          var pendingDelG = uiState.pendingDeleteGroupId === g.id;
          html += '<button type="button" class="link-btn danger" data-action="request-delete-group" data-id="'+g.id+'">'+
            (pendingDelG ? 'Tap again to delete' : 'Delete group')+'</button>';
          html += '</div>';

          html += '<label class="field-label" for="msg-'+g.id+'">Message</label>';
          html += '<textarea id="msg-'+g.id+'" rows="4" data-action="edit-message" data-id="'+g.id+'" placeholder="Type the message you want to send this group">'+escapeHtml(g.message)+'</textarea>';

          var hasMessage = (g.message || '').trim().length > 0;
          var copied = uiState.copiedGroupId === g.id;
          html += '<button type="button" class="primary-btn" data-action="copy-message" data-id="'+g.id+'" '+(hasMessage?'':'disabled')+'>'+
            (copied ? 'Copied' : 'Copy message')+'</button>';

          html += '<div class="contacts"><p class="field-label">People ('+count+')</p>';

          if(count > 0){
            var pct = Math.round((sentCount / count) * 100);
            html += '<p class="progress-label"><span>'+sentCount+' of '+count+' sent</span>'+
              (g.completed ? '<span class="badge-complete">Complete</span>' : '')+'</p>';
            html += '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
          }

          g.memberIds.forEach(function(pid){
            var person = findPerson(pid);
            if(!person) return;
            var isSent = g.sentIds.indexOf(pid) !== -1;
            html += '<div class="contact-row'+(isSent?' sent':'')+'">';
            html += '<input type="checkbox" class="sent-check" data-action="toggle-sent" data-id="'+g.id+'" data-person="'+pid+'" '+(isSent?'checked':'')+' aria-label="Mark '+escapeHtml(person.name)+' as sent" />';
            html += renderAvatar(person, 28);
            html += '<span class="contact-name">'+escapeHtml(person.name)+'</span>';
            if(person.link){
              html += '<a class="pill-btn" href="'+escapeHtml(person.link)+'" target="_blank" rel="noopener">Open chat</a>';
            } else {
              html += '<span class="pill-btn disabled">No link yet</span>';
            }
            html += '<button type="button" class="icon-btn" data-action="remove-member" data-id="'+g.id+'" data-person="'+pid+'">Remove</button>';
            html += '</div>';
          });
          html += '</div>';

          if(count > 0){
            html += '<div class="checklist-actions">';
            html += '<button type="button" class="primary-btn" data-action="finish-group" data-id="'+g.id+'" '+(sentCount===0?'disabled':'')+'>'+
              (g.completed ? 'Marked complete' : 'Finish')+'</button>';
            html += '<button type="button" class="link-btn danger" data-action="reset-checklist" data-id="'+g.id+'" '+((sentCount===0 && !g.completed)?'disabled':'')+'>Reset checklist</button>';
            html += '</div>';
          }

          var available = peopleState.people.filter(function(p){ return g.memberIds.indexOf(p.id) === -1; });
          html += '<div class="member-picker">';
          if(peopleState.people.length === 0){
            html += '<p class="hint-text">Add people in the People section below, then come back to add them here.</p>';
          } else if(available.length === 0){
            html += '<p class="hint-text">Everyone you have added is already in this group.</p>';
          } else {
            html += '<form class="add-member-form" data-action="add-member" data-id="'+g.id+'">';
            html += '<select name="personId">';
            available.forEach(function(p){ html += '<option value="'+p.id+'">'+escapeHtml(p.name)+'</option>'; });
            html += '</select>';
            html += '<button type="submit">Add to group</button>';
            html += '</form>';
          }
          html += '</div>';

          html += '</div>';
        }
        html += '</li>';
      });
      html += '</ul>';
    }

    html += '<div class="add-card"><h3>Add a group</h3>';
    html += '<form data-action="add-group">';
    html += '<input type="text" id="newGroupName" placeholder="e.g. Book club" required />';
    html += '<button type="submit">Add group</button>';
    html += '</form></div>';

    html += '<h2 class="section-title">People</h2>';
    if(peopleState.people.length === 0){
      html += '<p class="empty-state">No people yet. Add someone below to get started.</p>';
    } else {
      html += '<ul class="person-list">';
      peopleState.people.forEach(function(p){
        var expanded = uiState.expandedPersonId === p.id;
        html += '<li class="person-row">';
        html += '<button type="button" class="person-head" data-action="toggle-person" data-id="'+p.id+'">';
        html += '<span class="chevron'+(expanded?' open':'')+'">&#8250;</span>';
        html += renderAvatar(p, 32);
        html += '<span class="person-name">'+escapeHtml(p.name)+'</span>';
        if(!p.link){ html += '<span class="person-status">No link yet</span>'; }
        html += '</button>';

        if(expanded){
          html += '<div class="person-panel">';
          html += '<div class="panel-manage">';
          if(uiState.editingPersonId !== p.id){
            html += '<button type="button" class="link-btn" data-action="start-edit-person" data-id="'+p.id+'">Edit details</button>';
          } else {
            html += '<span></span>';
          }
          var pendingDelP = uiState.pendingDeletePersonId === p.id;
          html += '<button type="button" class="link-btn danger" data-action="request-delete-person" data-id="'+p.id+'">'+
            (pendingDelP ? 'Tap again to delete' : 'Delete person')+'</button>';
          html += '</div>';

          html += '<div class="photo-edit">';
          html += '<label for="photo-input-'+p.id+'" class="avatar-label">'+renderAvatar(p, 64)+'</label>';
          html += '<input type="file" accept="image/*" id="photo-input-'+p.id+'" data-action="photo-input" data-id="'+p.id+'" style="display:none" />';
          html += '<div class="photo-actions">';
          html += '<label for="photo-input-'+p.id+'" class="link-btn">'+(p.photo ? 'Change photo' : 'Add photo')+'</label>';
          if(p.photo){ html += '<button type="button" class="link-btn danger" data-action="remove-photo" data-id="'+p.id+'">Remove photo</button>'; }
          html += '</div></div>';

          if(uiState.editingPersonId === p.id){
            html += '<form class="person-edit-form" data-action="save-person-details" data-id="'+p.id+'">';
            html += '<label class="field-label" for="pname-'+p.id+'">Name</label>';
            html += '<input type="text" id="pname-'+p.id+'" name="name" value="'+escapeHtml(p.name)+'" />';
            html += '<label class="field-label" for="plink-'+p.id+'">Messenger link</label>';
            html += '<input type="text" id="plink-'+p.id+'" name="link" value="'+escapeHtml(p.link||'')+'" placeholder="Paste their profile or m.me link" />';
            html += '<button type="submit">Save</button>';
            html += '</form>';
          } else if(p.link){
            html += '<p class="field-label">Messenger link</p>';
            html += '<p class="link-preview">'+escapeHtml(p.link)+'</p>';
          }
          html += '</div>';
        }
        html += '</li>';
      });
      html += '</ul>';
    }

    html += '<div class="add-card"><h3>Add a person</h3>';
    html += '<form data-action="add-person">';
    html += '<input type="text" id="newPersonName" placeholder="Name" required />';
    html += '<input type="text" id="newPersonLink" placeholder="Messenger link (optional for now)" />';
    html += '<button type="submit">Add person</button>';
    html += '</form></div>';

    html += '<footer class="page-foot"><button type="button" class="link-btn danger" data-action="request-clear-all">'+
      (uiState.pendingClearAll ? 'Tap again to erase everything' : 'Clear all data')+'</button></footer>';

    root.innerHTML = html;

    if(uiState.editingPersonId){
      var i1 = document.getElementById('pname-'+uiState.editingPersonId);
      if(i1) i1.focus();
    }
    if(uiState.renamingGroupId){
      var i2 = root.querySelector('.rename-form input');
      if(i2){ i2.focus(); i2.select(); }
    }
  }

  function collapsePersonTransient(exceptId){
    if(uiState.editingPersonId && uiState.editingPersonId !== exceptId) uiState.editingPersonId = null;
    if(uiState.pendingDeletePersonId && uiState.pendingDeletePersonId !== exceptId){
      uiState.pendingDeletePersonId = null;
      if(pendingDeletePersonTimeout){ clearTimeout(pendingDeletePersonTimeout); pendingDeletePersonTimeout = null; }
    }
  }
  function collapseGroupTransient(exceptId){
    if(uiState.renamingGroupId && uiState.renamingGroupId !== exceptId) uiState.renamingGroupId = null;
    if(uiState.pendingDeleteGroupId && uiState.pendingDeleteGroupId !== exceptId){
      uiState.pendingDeleteGroupId = null;
      if(pendingDeleteGroupTimeout){ clearTimeout(pendingDeleteGroupTimeout); pendingDeleteGroupTimeout = null; }
    }
  }

  var app = document.getElementById('app');

  app.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action;
    var id = el.dataset.id;

    if(action === 'toggle-person'){
      uiState.expandedPersonId = (uiState.expandedPersonId === id) ? null : id;
      collapsePersonTransient(null);
      render();
    }
    else if(action === 'start-edit-person'){
      uiState.editingPersonId = id;
      render();
    }
    else if(action === 'remove-photo'){
      var p0 = findPerson(id);
      if(p0){ p0.photo = null; savePeople(); render(); }
    }
    else if(action === 'request-delete-person'){
      if(uiState.pendingDeletePersonId === id){
        peopleState.people = peopleState.people.filter(function(p){ return p.id !== id; });
        groupsState.groups.forEach(function(g){
          g.memberIds = g.memberIds.filter(function(pid){ return pid !== id; });
          g.sentIds = g.sentIds.filter(function(pid){ return pid !== id; });
        });
        if(uiState.expandedPersonId === id) uiState.expandedPersonId = null;
        uiState.editingPersonId = null;
        uiState.pendingDeletePersonId = null;
        if(pendingDeletePersonTimeout){ clearTimeout(pendingDeletePersonTimeout); pendingDeletePersonTimeout = null; }
        savePeople(); saveGroups(); render();
      } else {
        uiState.pendingDeletePersonId = id;
        if(pendingDeletePersonTimeout) clearTimeout(pendingDeletePersonTimeout);
        pendingDeletePersonTimeout = setTimeout(function(){ uiState.pendingDeletePersonId = null; render(); }, 3000);
        render();
      }
    }
    else if(action === 'toggle-group'){
      uiState.expandedGroupId = (uiState.expandedGroupId === id) ? null : id;
      collapseGroupTransient(null);
      render();
    }
    else if(action === 'start-rename'){
      uiState.renamingGroupId = id;
      render();
    }
    else if(action === 'request-delete-group'){
      if(uiState.pendingDeleteGroupId === id){
        groupsState.groups = groupsState.groups.filter(function(g){ return g.id !== id; });
        if(uiState.expandedGroupId === id) uiState.expandedGroupId = null;
        uiState.pendingDeleteGroupId = null;
        if(pendingDeleteGroupTimeout){ clearTimeout(pendingDeleteGroupTimeout); pendingDeleteGroupTimeout = null; }
        saveGroups(); render();
      } else {
        uiState.pendingDeleteGroupId = id;
        if(pendingDeleteGroupTimeout) clearTimeout(pendingDeleteGroupTimeout);
        pendingDeleteGroupTimeout = setTimeout(function(){ uiState.pendingDeleteGroupId = null; render(); }, 3000);
        render();
      }
    }
    else if(action === 'copy-message'){
      var g = findGroup(id);
      if(!g || !g.message.trim()) return;
      copyToClipboard(g.message).then(function(){
        uiState.copiedGroupId = id;
        render();
        if(copiedTimeout) clearTimeout(copiedTimeout);
        copiedTimeout = setTimeout(function(){ uiState.copiedGroupId = null; render(); }, 1500);
      }).catch(function(){
        showBanner("Couldn't copy automatically. Long-press the message box above to copy it manually.");
      });
    }
    else if(action === 'quick-copy'){
      var qText = quickMessageDraft;
      if(!qText.trim()) return;
      copyToClipboard(qText).then(function(){
        quickMessageDraft = '';
        uiState.quickCopied = true;
        render();
        if(quickCopiedTimeout) clearTimeout(quickCopiedTimeout);
        quickCopiedTimeout = setTimeout(function(){ uiState.quickCopied = false; render(); }, 1500);
      }).catch(function(){
        showBanner("Couldn't copy automatically. Long-press the message box above to copy it manually.");
      });
    }
    else if(action === 'remove-member'){
      var g2 = findGroup(id);
      if(!g2) return;
      var pid = el.dataset.person;
      g2.memberIds = g2.memberIds.filter(function(x){ return x !== pid; });
      g2.sentIds = g2.sentIds.filter(function(x){ return x !== pid; });
      saveGroups(); render();
    }
    else if(action === 'finish-group'){
      var g3 = findGroup(id);
      if(g3){ g3.completed = true; saveGroups(); render(); }
    }
    else if(action === 'reset-checklist'){
      var g4 = findGroup(id);
      if(g4){ g4.sentIds = []; g4.completed = false; saveGroups(); render(); }
    }
    else if(action === 'request-clear-all'){
      if(uiState.pendingClearAll){
        peopleState = { people: [] };
        groupsState = { groups: [] };
        uiState = {
          expandedPersonId: null, editingPersonId: null, pendingDeletePersonId: null,
          expandedGroupId: null, renamingGroupId: null, pendingDeleteGroupId: null,
          pendingClearAll: false, copiedGroupId: null
        };
        if(pendingClearTimeout){ clearTimeout(pendingClearTimeout); pendingClearTimeout = null; }
        savePeople(); saveGroups(); render();
      } else {
        uiState.pendingClearAll = true;
        if(pendingClearTimeout) clearTimeout(pendingClearTimeout);
        pendingClearTimeout = setTimeout(function(){ uiState.pendingClearAll = false; render(); }, 3000);
        render();
      }
    }
    else if(action === 'dismiss-banner'){
      clearBanner();
    }
  });

  app.addEventListener('submit', function(e){
    var form = e.target.closest('[data-action]');
    if(!form) return;
    e.preventDefault();
    var action = form.dataset.action;
    var id = form.dataset.id;

    if(action === 'add-person'){
      var nameInput = document.getElementById('newPersonName');
      var linkInput = document.getElementById('newPersonLink');
      var name = (nameInput.value || '').trim();
      if(!name) return;
      var newPerson = { id: genId('p'), name: name, link: normalizeLink(linkInput.value), photo: null };
      peopleState.people.push(newPerson);
      uiState.expandedPersonId = newPerson.id;
      savePeople(); render();
    }
    else if(action === 'save-person-details'){
      var p = findPerson(id);
      if(p){
        var newName = (form.elements.name.value || '').trim();
        if(newName) p.name = newName;
        p.link = normalizeLink(form.elements.link.value);
      }
      uiState.editingPersonId = null;
      savePeople(); render();
    }
    else if(action === 'add-group'){
      var gNameInput = document.getElementById('newGroupName');
      var gName = (gNameInput.value || '').trim();
      if(!gName) return;
      var newGroup = { id: genId('grp'), name: gName, message: '', memberIds: [], sentIds: [], completed: false };
      groupsState.groups.push(newGroup);
      uiState.expandedGroupId = newGroup.id;
      saveGroups(); render();
    }
    else if(action === 'confirm-rename'){
      var g = findGroup(id);
      var newGName = (form.elements.rename.value || '').trim();
      if(g && newGName){ g.name = newGName; }
      uiState.renamingGroupId = null;
      saveGroups(); render();
    }
    else if(action === 'add-member'){
      var g2 = findGroup(id);
      if(!g2) return;
      var personId = form.elements.personId.value;
      if(personId && g2.memberIds.indexOf(personId) === -1){
        g2.memberIds.push(personId);
        saveGroups(); render();
      }
    }
  });

  app.addEventListener('focusout', function(e){
    if(e.target.dataset && e.target.dataset.action === 'edit-message'){
      var g = findGroup(e.target.dataset.id);
      if(g){ g.message = e.target.value; saveGroups(); render(); }
    }
    else if(e.target.dataset && e.target.dataset.action === 'edit-quick-message'){
      quickMessageDraft = e.target.value;
      render();
    }
  });

  app.addEventListener('change', function(e){
    if(e.target.matches && e.target.matches('input[type="file"]') && e.target.dataset.action === 'photo-input'){
      var id = e.target.dataset.id;
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      loadAndResizeImage(file).then(function(dataUrl){
        var p = findPerson(id);
        if(p){ p.photo = dataUrl; savePeople(); render(); }
      }).catch(function(){
        showBanner("Couldn't load that photo. Try a different image.");
      });
    }
    else if(e.target.matches && e.target.matches('input[type="checkbox"]') && e.target.dataset.action === 'toggle-sent'){
      var gId = e.target.dataset.id;
      var pId = e.target.dataset.person;
      var g5 = findGroup(gId);
      if(g5){
        var idx = g5.sentIds.indexOf(pId);
        if(e.target.checked){
          if(idx === -1) g5.sentIds.push(pId);
        } else {
          if(idx !== -1) g5.sentIds.splice(idx, 1);
          g5.completed = false;
        }
        saveGroups(); render();
      }
    }
  });

  Promise.all([loadPeople(), loadGroups()]).then(function(results){
    peopleState = results[0];
    groupsState = results[1];
    render();
  });
})();

// Register the service worker so the app keeps working offline once it's
// been opened once (needed for a proper installable PWA / APK).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* offline caching is optional */ });
  });
}
</script>
</body>
</html>
